# Kubernetes manifests for AI News Aggregator
# Apply with: kubectl apply -f k8s.yaml

---
# Secret: fill in your own base64-encoded values
# To encode: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: ai-news-aggregator-secrets
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-your-key-here"
  EMAIL_SENDER: "your-email@gmail.com"
  EMAIL_RECIPIENT: "your-email@gmail.com"
  EMAIL_PASSWORD: "your-gmail-app-password"

---
# PersistentVolumeClaim: stores SQLite DB and logs across runs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-news-aggregator-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# CronJob: runs every day at 8:00 AM UTC
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-news-aggregator
spec:
  schedule: "0 8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ai-news-aggregator
              image: your-dockerhub-username/ai-news-aggregator:latest
              envFrom:
                - secretRef:
                    name: ai-news-aggregator-secrets
              volumeMounts:
                - name: data
                  mountPath: /app/data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: ai-news-aggregator-data
